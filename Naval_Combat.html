function renderSprites(){
  const live = new Set();
  // ---- purchased ships ----
  state.ships.forEach(s=>{
    if(!s.alive) return;
    live.add(s.id);
    const d = towerDef(s.kind);
    const inTransit = !!(s.transitPath && s.transitPath.length);
    const flash = (s.hitFlashUntil && Date.now()<s.hitFlashUntil) ? ' hitFlash' : '';
    const attn = (state.highlightThreatShip && s.kind==='threat') ? ' attnShip' : '';
    const cls = 'sprite own'+(s.upgraded?' upgraded':'')+(state.selectedShipId===s.id?' selected':'')+(inTransit?'':' movable')+flash+attn;
    const dirBadge = (s.kind==='dps' && s.dir) ? `<div class="dirLocked">${DIR_GLYPH[s.dir]}</div>` : '';
    const lvlBadge = (s.kind==='threat') ? `<div class="stackBadge" style="background:rgba(150,110,40,.95)">Lv${s.threatLvl||1}</div>` : '';
    const el = upsertSprite(s.id, cls, s.r, s.c, `
      <div class="ic" style="${inTransit?'opacity:.6':''}">${d.icon}</div>
      ${dirBadge}${lvlBadge}
      <div class="hpbar"><i style="width:${Math.max(0,s.hp/s.maxHp*100)}%"></i></div>
      <div class="shipTip">${shipTipHtml(s)}</div>`);
    el.style.pointerEvents = 'auto';
    // ONCE PLACED IT'S FIXED: you can't drag an already-bought ship to another cell. Its position is a
    // COMMITMENT — that's exactly what gives depth to the planning. Place it wrong and you have to SELL it
    // (losing 40%), not just drag it around freely.
    el.draggable = false;
  });
  // ---- previews (not yet bought) ----
  // Previews are now ONLY used for DPS while locking in a direction (every other type buys immediately on placement).
  state.previews.forEach(p=>{
    live.add(p.id);
    const d = towerDef(p.kind);
    const dirBadge = p.dir ? `<div class="dirPick">${DIR_GLYPH[p.dir]}</div>` : '';
    const hint = `<div class="dirHint">Click again to lock in the direction</div>`;
    const el = upsertSprite(p.id, 'sprite preview', p.r, p.c, `
      <div class="ic" style="opacity:.9">${d.icon}</div>${dirBadge}${hint}`);
    el.style.pointerEvents='none';   // let clicks fall through to the cell below -> locks in the direction
  });
  // ---- enemies: several STACKED in 1 cell -> draw only 1 representative sprite + a count badge ----
  // EACH enemy keeps its own DOM node for its whole lifetime -> CSS transitions can interpolate old->new
  // position, so movement is SMOOTH pixel-by-pixel (no snapping). When several stack up in 1 cell, they're
  // offset slightly so each one is still visible, with a total-count badge on the outermost one.
  const byCell = new Map();
  state.enemies.forEach(en=>{
    if(!en.alive) return;
    const k = en.r+'_'+en.c;
    if(!byCell.has(k)) byCell.set(k, []);
    byCell.get(k).push(en);
  });
  byCell.forEach(list=>{
    list.sort((a,b)=> a.seq-b.seq);
    list.forEach((en,i)=>{
      live.add(en.id);
      const d = enemyDef(en.kind);
      const flash = (en.hitFlashUntil && Date.now()<en.hitFlashUntil) ? ' hitFlash' : '';
      const badge = (i===list.length-1 && list.length>1) ? `<div class="stackBadge">x${list.length}</div>` : '';
      const el = upsertSprite(en.id, 'sprite enemy'+flash, en.r, en.c, `
        <div class="ic">${d.icon}</div>${badge}
        <div class="hpbar"><i style="width:${Math.max(0,en.hp/d.hp*100)}%; background:#d1594e;"></i></div>
        <div class="shipTip">${enemyTipHtml(en)}</div>`);
      // stack offset: each one that arrives later nudges slightly down-right
      const off = i * Math.round(CELL*0.13);
      el.style.marginLeft = off+'px';
      el.style.marginTop  = off+'px';
      el.style.zIndex = 10+i;
      el.style.pointerEvents='auto';
    });
  });
  Array.from(spriteEls.keys()).forEach(id=>{ if(!live.has(id)) removeSprite(id); });
}

// DPS direction-picker arrow (its own layer, drawn over the target cell so it's clear what's being aimed at)
function renderDirPick(){
  paintAllRangePreviews();
  renderSprites();
}
/* =====================================================================
   WAVE / SPAWN
===================================================================== */
function startWave(){
  const w = CFG.waves[state.waveIndex];
  if(!w) return;
  state.spawnQueue = w.spawns.map((sp,i)=>({...sp, remaining:sp.time, spawnRef:w.label+'_'+i}));
  state.waveStarted = true;
  // The whirlpool no longer resets per wave — it runs on its own eat/discharge cycle.   // trap is already loaded at the start of the wave
  hideCaption();
}
let enemySeq = 1;
function spawnEnemy(sp){
  const d = enemyDef(sp.kind);
  const side = sp.side || CFG.sides[0];
  const en = {
    id:'e'+(idc++), seq: enemySeq++, kind:sp.kind, spawnRef:sp.spawnRef,
    r:CFG.den.r, c:CFG.den.c,
    hp:d.hp, alive:true,
    homeSide: side,                       // the side it was assigned at spawn (only a PREFERENCE, not forced)
    travelled:[CFG.den.r+'_'+CFG.den.c],  // cells already crossed — never turns back
    plan:[], slowLeft:0, slowTicks:0,
  };
  en.plan = planFor(en.r, en.c, en.kind, en.homeSide, en.travelled);
  state.enemies.push(en);
}
// Recompute the route for EVERY living enemy (called every step and whenever Threat changes) —
// this is what lets enemies react LIVE to placing/upgrading/selling a Threat tower and to the whirlpool.
function replanEnemies(){
  refreshJammerZero();
  state.enemies.forEach(en=>{
    if(!en.alive || en.phase) return;
    en.plan = planFor(en.r, en.c, en.kind, en.homeSide, en.travelled);
  });
  refreshJammerZero();
}

/* =====================================================================
   SHIP TRANSIT (Flagship -> its placed cell) — advances EVERY step, even while still in the planning phase
===================================================================== */
function advanceShipTransits(){
  let moved = false;
  state.ships.forEach(s=>{
    if(!s.alive || !s.transitPath || !s.transitPath.length) return;
    const next = s.transitPath.shift();
    s.r = next.r; s.c = next.c;
    moved = true;
  });
  return moved;
}

/* =====================================================================
   ENEMY MOVEMENT — snaps cell-by-cell. A blocking tower -> enemies pile up, STACKING up to 3 units in
   the SAME cell right in front of the tower (per spec, "blocks up to 3 enemies").
===================================================================== */
function towerBlockingAt(r,c){
  return state.ships.find(s=> s.alive && s.r===r && s.c===c &&
    towerDef(s.kind).blocks && !(s.transitPath && s.transitPath.length));
}
function enemiesAt(r,c){ return state.enemies.filter(e=> e.alive && e.r===r && e.c===c); }

function moveEnemies(){
  /* PHASE 0 — TRIGGER THE WHIRLPOOL TRAP BEFORE ANYONE ELSE CAN MOVE FURTHER.
     Whichever enemy is about to step exactly onto the whirlpool cell while it's UNARMED becomes the victim
     itself: dies instantly and arms the trap. This must run BEFORE the regular movement pass — otherwise
     enemies standing right at the fork could slip past the fork in that SAME step and end up stuck
     (the exact bug we hit before: 2 units died). */
  if(CFG.swirl && state.swirlArmed){
    let eatenThisStep = 0;
    for(const en of state.enemies){
      if(!en.alive || en.phase) continue;
      if(en.slowLeft>0) continue;
      if(enemyDef(en.kind).swirlImmune) continue;   // Boss is too big — the whirlpool can't eat it, and doesn't get triggered by it either
      const nx = en.plan && en.plan[0];
      if(!nx || !isSwirl(nx.r,nx.c)) continue;
      if(towerBlockingAt(nx.r,nx.c)) continue;
      en.plan.shift();
      en.r = nx.r; en.c = nx.c; en.travelled.push(nx.r+'_'+nx.c);
      // Eats EVERY enemy that steps onto the whirlpool cell in this same step (if 2-3 are stacked together,
      // they all die), then switches to discharging.
      en.alive = false;                     // (gives no gold)
      state.swirlJustTriggered = true;
      eatenThisStep++;
    }
    if(eatenThisStep>0){
      state.swirlArmed = false;
      state.swirlCountdown = CFG.swirlCycleSteps || 5;
    }
    // trap just triggered -> REPLAN EVERYONE'S ROUTE immediately, so an enemy right at the fork can still detour to the other branch
    if(state.swirlJustTriggered) replanEnemies();
  }
  // The Boss moves slowly: only advances every slowFactor steps
  state.enemies.forEach(en=>{
    if(!en.alive) return;
    if(en.phase==='arrived'){ return; }
    const d = enemyDef(en.kind);
    if(d.slowFactor){
      en.slowTicks = (en.slowTicks||0)+1;
      if(en.slowTicks % d.slowFactor !== 0) return;
    }
    // ice tile: stays put for 1 more step
    if(en.slowLeft>0){ en.slowLeft--; return; }

    if(!en.plan || !en.plan.length) return;                // already arrived / no route left
    const nx = en.plan[0];
    if(towerBlockingAt(nx.r,nx.c)) return;                 // blocked by a tower -> stops (stacks up)
    if(enemiesAt(nx.r,nx.c).length >= MAX_STACK) return;   // that cell already has 3 -> waits its turn
    en.plan.shift();
    en.r = nx.r; en.c = nx.c;
    en.travelled.push(nx.r+'_'+nx.c);
    if(isIce(en.r,en.c)) en.slowLeft = 1;
    // Trap already discharged and something still steps in (only happens when it got funneled with no clean route left) -> dies
    // while discharging it's harmless to walk through; it only kills if the trap is ARMED (already handled in phase 0)
    if(isSwirl(en.r,en.c) && state.swirlArmed && !enemyDef(en.kind).swirlImmune){ en.alive = false; return; }
    if(isFort(en.r,en.c)) en.phase='arrived';
  });
}
// An enemy that reached the Flagship cell -> deals damage then disappears
function resolveFortHits(){
  state.enemies.forEach(en=>{
    if(en.alive && en.phase==='arrived'){
      // A BOSS reaching the Flagship = INSTANT LOSS, no matter how much HP is left (Level 5 rule)
      if(enemyDef(en.kind).instantLose) state.fortHp = 0;
      else state.fortHp -= enemyDef(en.kind).atk*3;
      en.alive = false;   // reaching the Flagship -> gives NO gold
    }
  });
}
// End-of-level star rating based on remaining Flagship HP — gives the player a reason to replay without raising the difficulty
function starsFor(hp){ return hp>=100 ? 3 : (hp>=60 ? 2 : 1); }

/* =====================================================================
   COMBAT — each tower attacks the enemies within its RANGE (DPS: 1 cell in the locked-in direction, only
   the 1 enemy "at the front"; Range: 8 surrounding cells, up to 3 enemies). Any enemy CURRENTLY BLOCKED BY
   a tower attacks that tower back (so 3 Normals piling onto 1 DPS really hurts -> you need a Range to clean up the group).
===================================================================== */
function enemiesBlockedBy(tower){
  // an enemy standing where the NEXT cell on its route is exactly this tower's cell
  return state.enemies.filter(en=>{
    if(!en.alive || en.phase) return false;
    const nx = en.plan && en.plan[0];
    return nx && nx.r===tower.r && nx.c===tower.c;
  });
}
function stepCombatResolve(){
  // Combat happens SIMULTANEOUSLY: lock in the list of enemies currently blocking BEFORE towers strike, so
  // an enemy that dies this very step still lands 1 counter-hit. If computed afterward, any tower that
  // one-shots an enemy would NEVER take damage — which is nonsensical and would ruin the whole matchup
  // balance (a DPS blocking a whole group without losing any HP).
  const blockedBy = new Map();
  state.ships.forEach(tower=>{
    if(!tower.alive) return;
    if(tower.transitPath && tower.transitPath.length) return;
    if(towerDef(tower.kind).blocks) blockedBy.set(tower.id, enemiesBlockedBy(tower));
  });

  state.ships.forEach(tower=>{
    if(!tower.alive) return;
    if(tower.transitPath && tower.transitPath.length) return; // hasn't arrived yet -> can't attack yet
    const def = towerDef(tower.kind);

    // --- tower deals damage ---
    const atkNow = tAtk(tower.kind, tower.upgraded);
    if(atkNow>0){
      const cells = cellsInShape(tower.kind, tower.r, tower.c, tower.dir, tower.upgraded);
      let inRange = [];
      cells.forEach(p=> inRange = inRange.concat(enemiesAt(p.r,p.c)));
      inRange = inRange.filter(e=>!e.phase);
      inRange.sort((a,b)=> a.seq-b.seq);           // "enemy at the front" = the one that entered the map earliest
      const targets = inRange.slice(0, def.maxTargets);
      targets.forEach(en=>{
        en.hp -= atkNow;
        en.hitFlashUntil = Date.now()+300;
        if(en.hp<=0) killEnemy(en);
      });
    }

    // --- enemies BLOCKED by this tower counterattack it (even a tower that can't fire) ---
    if(def.blocks){
      const blockers = blockedBy.get(tower.id) || [];
      blockers.forEach(en=>{
        tower.hp -= enemyDef(en.kind).atk;
        tower.hitFlashUntil = Date.now()+300;
      });
      if(tower.hp<=0) tower.alive=false;
    }
  });
  state.enemies = state.enemies.filter(e=>e.alive);
  state.ships.forEach(s=>{ if(s.alive && s.hp<=0) s.alive=false; });
}
/* Gold reward based on TACTICAL QUALITY, not on frugality: blocking an enemy FAR AWAY (near the start of
   the route) earns UP TO TRIPLE the gold compared to letting it crawl right up to the Flagship before
   killing it. -> aggressive forward defense (harder, requires correctly predicting the enemy's route) is
   properly rewarded; turtling right at the door is safe but leaves you poor. This reward is for GOOD
   POSITIONING, not for counting every last coin. */
/* Gold reward for killing 1 enemy. ONLY counted when the PLAYER'S SHIP is what kills it —
   dying to the whirlpool, or reaching the Flagship, gives NO gold either way (see moveEnemies/resolveFortHits:
   those set alive=false directly, bypassing killEnemy).
   The position multiplier is capped between x1..x2 (it used to be x1..x3) to keep income per wave
   PREDICTABLE, which is what makes it possible to design "after this wave you can afford exactly this many more ships."*/
function killGoldFor(en){
  const total = (CFG.defaultPaths[en.homeSide]||[]).length || 1;
  const left  = (en.plan||[]).length;
  const far   = Math.max(0, Math.min(1, left/total));  // 1 = just left the den, 0 = right next to the Flagship
  return Math.round(CFG.killGold * (1 + far));
}
// Call THIS function only when the player's ship is what actually killed the enemy -> only then does gold get added.
function killEnemy(en){
  en.alive=false;
  const g = killGoldFor(en);
  state.gold += g;
  state.lastKillGold = g;
  state.encountered.add(en.kind);
}

/* =====================================================================
   1 STEP
===================================================================== */
function stepCombat(){
  state.stepCount++;
  // The WHIRLPOOL runs on a CYCLE: after it drowns 1 enemy it shuts off for a few steps (enemies sneak
  // through that lane while it's off), then re-arms itself once time's up -> the player has to TIME it
  // rather than get 1 free use and done.
  // Whirlpool: ARMED -> eats exactly 1 -> DISCHARGES (harmless) for a few steps -> re-ARMS itself.
  // While DISCHARGING that cell's Threat = 0 so enemies pass through normally; once ARMED its Threat = 10 so
  // any enemy STILL AT THE DEN will dodge to another lane, and only ones already committed to the lane get eaten.
  if(CFG.swirl && !state.swirlArmed && state.swirlCountdown!=null){
    state.swirlCountdown--;
    if(state.swirlCountdown<=0){ state.swirlArmed=true; state.swirlCountdown=null; }
  }
  resolveFortHits();
  // FIGHT FIRST, MOVE SECOND. It used to be the other way around, so an enemy that had just stepped into
  // range would get hit IMMEDIATELY in that same step while its sprite was still gliding toward the cell —
  // it looked like "it hasn't even arrived and it's already being shot." Now it must spend a FULL step
  // standing in range before fighting starts, matching exactly what you see on the map.
  stepCombatResolve();
  state.enemies = state.enemies.filter(e=>e.alive);
  replanEnemies();     // reacts live to Threat / whirlpool / Jammer
  moveEnemies();
  if(state.swirlJustTriggered){ state.swirlJustTriggered = false; onTutorialEvent('swirlArmed'); }
  // SPAWN after movement: a freshly spawned enemy stays put at the Enemy Den for this entire step (clearly
  // visible "emerging"), and only starts moving on the next step — instead of jumping a cell in the very
  // same step it spawned.
  for(let i=state.spawnQueue.length-1;i>=0;i--){
    const sp = state.spawnQueue[i];
    sp.remaining--;
    if(sp.remaining<=0){ spawnEnemy(sp); state.spawnQueue.splice(i,1); }
  }
  checkWaveEnd();
  checkLoss();
  render();
}

/* =====================================================================
   CAPTION / TUTORIAL
===================================================================== */
const captionEl = document.getElementById('caption');
function setCaption(html){ captionEl.innerHTML=html; captionEl.classList.add('show'); }
function hideCaption(){ captionEl.classList.remove('show'); }

function onTutorialEvent(evt, arg){
  if(ACTIVE_LEVEL==='man4'){
    if(evt==='swirlArmed'){
      state.highlightSwirl = true;
      setCaption('🌀 <b>The Whirlpool trap just triggered!</b> The one that just stepped in got dragged down and killed — and by doing so, it armed the trap: that cell now has <b>Threat = 10</b> so <b>everyone behind it sees it and dodges</b>. Notice: they detour down the <b>lower loop</b> instead of jumping to the top lane. To force them onto the top lane, you\'d also need to seal off that detour with Threat.');
    }
    render();
    return;
  }
  if(ACTIVE_LEVEL==='man1'){
    if(evt==='bought' && arg==='dps' && state.tutorialStage==='placeDPS'){
      state.tutorialStage='wave1';
      setCaption('👉 The DPS is leaving the Flagship for its position (takes a few steps to arrive). It blocks the path and attacks 1 cell in its locked-in direction — plenty to solo a <b>Tanker</b>. Click <b>⚔ Start Battle</b> (or <b>⏭ Run 1 Step</b> to watch it step by step) to kick off Wave 1!');
    } else if(evt==='bought' && arg==='range' && state.tutorialStage==='placeRange'){
      state.tutorialStage='wave2';
      setCaption('👉 Range hits <b>8 surrounding cells</b> and can strike up to <b>3 enemies at once</b> — exactly what you need to clear a cluster of 3 Normals. Click <b>⚔ Start Battle</b> to kick off Wave 2!');
    }
  } else if(ACTIVE_LEVEL==='man2'){
    if(evt==='bought' && arg==='threat'){
      // Once Threat is placed -> flash the WAVE PANEL on the left + the "Threat = 1" label on the lane (per request)
      state.tutorialStage='threatPlaced';
      state.highlightWavePanel = true;
      state.highlightThreatLabel = true;
      setCaption('👉 Threat placed! See the <b>"Threat = 1"</b> label flashing on the bottom lane — that lane is now scary. The Wave panel on the left (also flashing) has split itself into <b>Top Lane / Bottom Lane</b> and updates live with Threat.');
    } else if(evt==='threatUpgraded'){
      const msg = arg===2
        ? '👉 Threat Lv2 — now scares off <b>Tankers</b> too (Alert Level 2), not just Normals.'
        : '👉 Threat Lv3 — now scares off <b>Jammers</b> too (Alert Level 3).';
      setCaption(msg+' Hover over an enemy\'s name in the left panel, or an enemy/ship icon on the map, to see its Alert Level.');
    }
  }
  render();
}

/* =====================================================================
   WAVE END / LOSS / WIN
===================================================================== */
function checkWaveEnd(){
  if(!state.waveStarted) return;
  if(state.spawnQueue.length) return;
  if(state.enemies.some(e=>e.alive)) return;
  state.waveStarted=false;
  state.highlightIce = false;   // once the ice-tile lesson is learned, stop flashing it
  // The whirlpool returns to safe the moment planning resumes (it's never left "armed" the whole time you're setting up)
  state.gold += CFG.waveClearBonus[state.waveIndex] || 60;
  const finished = state.waveIndex;
  state.waveIndex++;
  state.phase='planning';
  if(ACTIVE_LEVEL==='man1' && finished===0 && !state.unlocked.range){
    state.unlocked.range = true;
    state.tutorialStage = 'placeRange';
    setCaption('🎉 The Tanker went down to the DPS! The next wave adds <b>3 Normals</b> traveling together — the DPS only hits 1 per step so the whole cluster will swarm it. Buy <b>Range</b> (the card that just unlocked) to clear all 3 at once.');
    renderShipyard(); render();
    return;
  }
  if(ACTIVE_LEVEL==='man4' && finished===0){
    state.highlightSwirl = true;
    setCaption('🌀 Keep in mind: the <b>Whirlpool resets after EVERY wave</b> — at the start of the next wave the trap is unarmed again, so the first enemy on the middle lane will charge in and die, and only the ones behind it will dodge. Every wave "gives away" 1 free kill like that.');
  }
  if(ACTIVE_LEVEL==='man2' && finished===0){
    state.highlightWavePanel = false;
    const hasThreat = state.ships.some(s=>s.alive && s.kind==='threat');
    if(hasThreat){
      // Flash the ACTUAL Threat tower icon on the map so the player knows to click it to open the upgrade panel
      state.highlightThreatShip = true;
      state.tutorialStage = 'upgradeThreat';
      setCaption('🎉 Wave 1 done! <b>Click the flashing Threat tower on the map</b> to open the upgrade panel on the right. Reaching <b>Lv2</b> will scare off <b>Tankers</b> too (Alert Level 2), not just Normals. Hover over an enemy\'s name in the left panel to see its Alert Level.');
    } else {
      state.tutorialStage = 'buyThreat';

    setTimeout(()=> showEndModal(true), 1400);

  }

}

/* =====================================================================
   EXTERNAL DATA SOURCE — connects the game to a table file (.csv) so numbers can be tweaked WITHOUT
   touching code. Click the "📊 Balance Data" button -> pick So_Lieu_Can_Bang.csv. From then on, just
   EDIT & SAVE that file (Excel / a downloaded Google Sheet / Notepad) and the game updates AUTOMATICALLY,
   no page reload needed. The file has 3 columns: Group, Data Key, Value (a Notes column is optional and ignored by the game).
===================================================================== */
function balanceSchema(){
  const s = {
    'rule.maxStack':        { get:()=>MAX_STACK,             set:v=>{ MAX_STACK=v; } },
    'rule.stepMs':          { get:()=>STEP_MS,               set:v=>{ STEP_MS=v; startTicker(); } },
    'rule.sellRefund':      { get:()=>SELL_REFUND,           set:v=>{ SELL_REFUND=v; } },
    'tower.dps.cost':       { get:()=>TOWER_DEFS.dps.cost,   set:v=>TOWER_DEFS.dps.cost=v },
    'tower.dps.hp':         { get:()=>TOWER_DEFS.dps.hp[0],  set:v=>TOWER_DEFS.dps.hp[0]=v },
    'tower.dps.hpUp':       { get:()=>TOWER_DEFS.dps.hp[1],  set:v=>TOWER_DEFS.dps.hp[1]=v },
    'tower.dps.atk':        { get:()=>TOWER_DEFS.dps.atk[0], set:v=>TOWER_DEFS.dps.atk[0]=v },
    'tower.dps.atkUp':      { get:()=>TOWER_DEFS.dps.atk[1], set:v=>TOWER_DEFS.dps.atk[1]=v },
    'tower.dps.upgradeCost':{ get:()=>TOWER_DEFS.dps.upgradeCost, set:v=>TOWER_DEFS.dps.upgradeCost=v },
    'tower.range.cost':     { get:()=>TOWER_DEFS.range.cost,  set:v=>TOWER_DEFS.range.cost=v },
    'tower.range.hp':       { get:()=>TOWER_DEFS.range.hp[0], set:v=>TOWER_DEFS.range.hp[0]=v },
    'tower.range.hpUp':     { get:()=>TOWER_DEFS.range.hp[1], set:v=>TOWER_DEFS.range.hp[1]=v },
    'tower.range.atk':      { get:()=>TOWER_DEFS.range.atk[0],set:v=>TOWER_DEFS.range.atk[0]=v },
    'tower.range.atkUp':    { get:()=>TOWER_DEFS.range.atk[1],set:v=>TOWER_DEFS.range.atk[1]=v },
    'tower.range.ring':     { get:()=>TOWER_DEFS.range.ring[0],set:v=>TOWER_DEFS.range.ring[0]=v },
    'tower.range.ringUp':   { get:()=>TOWER_DEFS.range.ring[1],set:v=>TOWER_DEFS.range.ring[1]=v },
    'tower.range.maxTargets':{get:()=>TOWER_DEFS.range.maxTargets,set:v=>TOWER_DEFS.range.maxTargets=v },
    'tower.range.upgradeCost':{get:()=>TOWER_DEFS.range.upgradeCost,set:v=>TOWER_DEFS.range.upgradeCost=v },
    'tower.threat.cost':    { get:()=>TOWER_DEFS.threat.cost, set:v=>TOWER_DEFS.threat.cost=v },
    'tower.threat.hp':      { get:()=>TOWER_DEFS.threat.hp[0],set:v=>{TOWER_DEFS.threat.hp[0]=v;TOWER_DEFS.threat.hp[1]=v;} },
    'tower.threat.upCostLv2':{get:()=>TOWER_DEFS.threat.threatUpgradeCost[0],set:v=>TOWER_DEFS.threat.threatUpgradeCost[0]=v },
    'tower.threat.upCostLv3':{get:()=>TOWER_DEFS.threat.threatUpgradeCost[1],set:v=>TOWER_DEFS.threat.threatUpgradeCost[1]=v },
    'enemy.normal.hp':      { get:()=>ENEMY_DEFS.normal.hp,  set:v=>ENEMY_DEFS.normal.hp=v },
    'enemy.normal.atk':     { get:()=>ENEMY_DEFS.normal.atk, set:v=>ENEMY_DEFS.normal.atk=v },
    'enemy.normal.wariness':{ get:()=>ENEMY_DEFS.normal.wariness, set:v=>ENEMY_DEFS.normal.wariness=v },
    'enemy.tank.hp':        { get:()=>ENEMY_DEFS.tank.hp,    set:v=>ENEMY_DEFS.tank.hp=v },
    'enemy.tank.atk':       { get:()=>ENEMY_DEFS.tank.atk,   set:v=>ENEMY_DEFS.tank.atk=v },
    'enemy.tank.wariness':  { get:()=>ENEMY_DEFS.tank.wariness, set:v=>ENEMY_DEFS.tank.wariness=v },
    'enemy.jammer.hp':      { get:()=>ENEMY_DEFS.jammer.hp,  set:v=>ENEMY_DEFS.jammer.hp=v },
    'enemy.jammer.atk':     { get:()=>ENEMY_DEFS.jammer.atk, set:v=>ENEMY_DEFS.jammer.atk=v },
    'enemy.jammer.wariness':{ get:()=>ENEMY_DEFS.jammer.wariness, set:v=>ENEMY_DEFS.jammer.wariness=v },
  };
  const LV = { man1:CFG_MAN1, man2:CFG_MAN2, man3:CFG_MAN3, man4:CFG_MAN4, man5:CFG_MAN5 };
  Object.keys(LV).forEach(name=>{
    const L = LV[name];
    s[name+'.startGold'] = { get:()=>L.startGold, set:v=>L.startGold=v };
    s[name+'.killGold']  = { get:()=>L.killGold,  set:v=>L.killGold=v };
    L.waveClearBonus.forEach((_,i)=>{
      s[name+'.waveBonus'+(i+1)] = { get:()=>L.waveClearBonus[i], set:v=>L.waveClearBonus[i]=v };
    });
    if(L.swirl){
      s[name+'.swirlThreat'] = { get:()=>L.swirlThreat, set:v=>L.swirlThreat=v };
    }
  });
  return s;
}
function parseBalanceCsv(text){
  const out = {};
  text.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    // simple CSV splitting (supports cells wrapped in ")
    const cells = line.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(s=>s.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"').trim());
    const key = cells[1], raw = cells[2];
    if(!key || raw===undefined || raw==='') return;
    const num = Number(String(raw).replace(',', '.'));
    if(!isNaN(num)) out[key] = num;
  });
  return out;
}
function applyBalance(map){
  const schema = balanceSchema();
  let n = 0, unknown = [];
  Object.keys(map).forEach(k=>{
    if(schema[k]){ schema[k].set(map[k]); n++; }
    else if(/^(rule|tower|enemy|level)\./.test(k)) unknown.push(k);
  });
  // Max HP of ships currently on the map also updates accordingly (keeps their current HP ratio)
  state.ships.forEach(s=>{
    const mx = tHp(s.kind, s.upgraded);
    if(mx !== s.maxHp){ const ratio = s.maxHp ? s.hp/s.maxHp : 1; s.maxHp = mx; s.hp = Math.max(1, Math.round(mx*ratio)); }
  });
  render();
  return { applied:n, unknown };
}
function balanceToCsv(){
  const schema = balanceSchema();
  const GHI = {
    'rule.maxStack':'Max number of enemies stacked in 1 cell while blocked',
    'rule.stepMs':'Duration of 1 step at x1 speed (milliseconds)',
    'rule.sellRefund':'What fraction of spent gold selling a ship refunds (0.6 = 60%)',
    'tower.dps.upgradeCost':'DPS upgrade price (fully heals)',
    'tower.range.ring':'1 = the 8 surrounding cells',
    'tower.range.ringUp':'2 = 1 more ring on top (24 cells)',
    'tower.range.upgradeCost':'Range upgrade price',
    'tower.threat.upCostLv2':'Price to upgrade Threat Lv1 -> Lv2 (also scares off Tankers)',
    'tower.threat.upCostLv3':'Price to upgrade Threat Lv2 -> Lv3 (also scares off Jammers)',
    'enemy.normal.wariness':'Alert Level: dodges any cell with Threat >= this number',
    'enemy.tank.wariness':'Alert Level',
    'enemy.jammer.wariness':'Alert Level',
    'man1.killGold':'Gold earned per enemy killed',
    'man1.startGold':'Starting gold for Level 1 (exactly 1 DPS)',
    'man1.waveBonus1':'Wave 1 clear bonus — adds just enough spare gold to buy Range OR upgrade the DPS',
    'man2.startGold':'Starting gold for Level 2 (exactly 1 DPS + 1 Range)',
    'man3.startGold':'Starting gold for Level 3 (exactly 2 DPS + 1 Range)',
    'man4.startGold':'Starting gold for Level 4',
    'man4.swirlThreat':'Threat of the whirlpool cell AFTER the trap triggers (the first one to step in)',
  };
  const rows = [['Group','Data Key','Value','Notes']];
  Object.keys(schema).forEach(k=>{
    rows.push([k.split('.')[0], k, schema[k].get(), GHI[k]||'']);
  });
  return rows.map(r=>r.map(x=>{
    const s = String(x);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
}

/* ---------- Load the file + WATCH for changes to update in REAL TIME ---------- */
let balanceFileHandle = null, balanceLastMod = 0, balanceWatchTimer = null;
function balanceToast(msg, bad){
  let el = document.getElementById('balanceToast');
  if(!el){
    el = document.createElement('div'); el.id='balanceToast'; document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = 'show'+(bad?' bad':'');
  clearTimeout(el._t); el._t = setTimeout(()=> el.className='', 2600);
}
function ingestBalanceText(text, srcName){
  try{
    const map = parseBalanceCsv(text);
    const res = applyBalance(map);
    balanceToast(`📊 Loaded ${res.applied} values from ${srcName}`+(res.unknown.length?` (skipped ${res.unknown.length} unknown key(s))`:''));
  }catch(e){ balanceToast('⚠ Balance data file error: '+e.message, true); }
}
async function pickBalanceFile(){
  if(window.showOpenFilePicker){
    try{
      const [h] = await window.showOpenFilePicker({ types:[{description:'Balance data', accept:{'text/csv':['.csv'],'text/plain':['.txt']}}] });
      balanceFileHandle = h;
      const f = await h.getFile();
      balanceLastMod = f.lastModified;
      ingestBalanceText(await f.text(), f.name);
      startBalanceWatch();
      return;
    }catch(e){ if(e && e.name==='AbortError') return; }
  }
  // Browser doesn't support the watchable file picker -> fall back to a plain input (you'll need to re-pick after every edit)
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.csv,.txt';
  inp.onchange = ()=>{ const f=inp.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>ingestBalanceText(rd.result, f.name); rd.readAsText(f); };
  inp.click();
}
// Checks once a second whether the file was SAVED again -> if so, reload it immediately (real time)
function startBalanceWatch(){
  clearInterval(balanceWatchTimer);
  balanceWatchTimer = setInterval(async ()=>{
    if(!balanceFileHandle) return;
    try{
      const f = await balanceFileHandle.getFile();
      if(f.lastModified !== balanceLastMod){
        balanceLastMod = f.lastModified;
        ingestBalanceText(await f.text(), f.name);
      }
    }catch(e){ /* file was deleted/moved -> ignore, try again next time */ }
  }, 1000);
}
function downloadBalanceCsv(){
  const blob = new Blob(['﻿'+balanceToCsv()], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'So_Lieu_Can_Bang.csv';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
// Dragging a .csv file straight onto the game window also loads it

  e.preventDefault();

});

  setCaption('👉 <b>Level 4 — Whirlpool</b>: the 🌀 cell is an <b>unarmed trap</b> — the first enemy to step in gets dragged down and killed, arming the trap (Threat 10), which makes everyone after it <b>detour down the lower loop</b>. That\'s exactly what you WANT: the loop is longer <b>and has an ice tile 🧊 that slows it by another step</b>, plus more room to fit Range towers — turning it into a <b>kill zone</b>. Use the trap + Threat to funnel enemies in there instead of trying to hold the line right at the Flagship\'s door.');
} else if(ACTIVE_LEVEL==='man5'){
  state.highlightSwirl = true;
  setCaption('💀 <b>Level 5 — Death\'s Door</b>: there are <b>3 lanes</b> but only <b>2 pockets to place ships in</b> (row 2 and row 4) — each pocket only reaches 2 lanes, and only the <b>MIDDLE lane is reachable from both pockets</b>. <b>The Boss is immune to Threat</b> so it always takes the middle lane, and <b>touching the Flagship is an instant loss</b>. Use Threat to funnel regular enemies to the sides, mass your firepower on the middle lane — and remember to kill the Jammer before it neutralizes your Threat.');
} else {
  setCaption('👉 <b>Level 3 — Two-Front Assault</b>: enemies set out from 🏴‍☠️ along both the top and bottom lanes. At the junction (column 5) they\'ll consider cutting across to the other lane if the Threat ahead is higher than their Alert Level — unless both lanes are dangerous, in which case they stay stuck on their original lane.');
}
render();
renderSpeedUI();
startTicker();

})();
